<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link href="./output.css" rel="stylesheet" />
        <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
        <script
            src="https://kit.fontawesome.com/11789dfbf8.js"
            crossorigin="anonymous"
        ></script>
    </head>

    <body>
        <div class="h-screen bg-gradient-to-tr from-sky-200 to-sky-100">
            <div class="pt-12 px-6">
                <div class="text-5xl font-bold text-stone-800">Hi, I'm Olle</div>
                <div class="text-2xl text-stone-700">Senior Full-Stack Engineer</div>
                <div class="content flex pt-10">
                    <div class="text-sm pr-6 text-stone-800">
                        Transform your business with a custom website or web app. I offer
                        expert development for high-performance, visually appealing, and
                        user-friendly solutions. Let’s bring your vision to life and drive
                        online success for your business.
                    </div>
                    <img
                        class="pt-4 rounded-3xl w-1/3 h-1/3"
                        src="./assets/avatar-removebg-preview.png"
                        alt="Olle"
                    />
                </div>
                <div class="pt-10 grid justify-items-center">
                    <div class="m-2">
                        <a
                            href="https://www.linkedin.com/in/olle-h%C3%A4llbom-a284b57b/"
                            target="_blank"
                            class="flex justify-center bg-[#0077B5] rounded-md py-1 px-4 w-fit"
                        >
                            <div class="text-white text-md tracking-wide font-bold">
                                LinkedIn
                            </div>
                            <div class="shadow-border px-2">
                                <div>
                                    <i class="text-white fa-brands fa-linkedin fa-xl"></i>
                                </div>
                            </div>
                        </a>
                    </div>
                    <div class="m-2">
                        <a
                            href="https://github.com/ollehbom"
                            target="_blank"
                            class="flex justify-center bg-neutral-900 rounded-md py-1 px-4 w-fit"
                        >
                            <div class="text-white text-md tracking-wide font-bold">
                                GitHub
                            </div>
                            <div class="px-2">
                                <div>
                                    <i class="text-white fa-brands fa-github fa-xl"></i>
                                </div>
                            </div>
                        </a>
                    </div>
                    <div class="m-2">
                        <a
                            href="mailto:ollehbom@gmail.com"
                            class="flex justify-center bg-emerald-500 rounded-md py-1 px-4 w-fit"
                        >
                            <div class="text-white text-md tracking-wide font-bold">
                                E-mail
                            </div>
                            <div class="px-2">
                                <div>
                                    <i
                                        class="text-white fa-regular fa-envelope fa-xl"
                                    ></i>
                                </div>
                            </div>
                        </a>
                    </div>
                    <div class="m-2">
                        <a
                            href="assets/Olle CV.pdf"
                            download="Olle CV.pdf"
                            class="flex justify-center bg-red-500 rounded-md py-1 px-4 w-fit"
                        >
                            <div class="text-white text-md font-bold">CV</div>
                            <div class="px-2">
                                <div>
                                    <i
                                        class="text-white fa-solid fa-file-arrow-down fa-xl"
                                    ></i>
                                </div>
                            </div>
                        </a>
                    </div>
                </div>
            </div>
        </div>

</html>
